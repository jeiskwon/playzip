<style>
  #nabti-root {

    --lavender: #b8a9d9;
    --cream: #fffaf3;
    --text: #4a3f4f;

    margin-bottom: 16px;
  }
  .nabti-title {
    font-size: 22px;
    font-weight: 800;
    text-align: center;

  }
  .nabti-sub {
    font-size: 14px;
    text-align: center;
    color: #8a7d8f;
    line-height: 1.6;

  .nabti-cover-img {

    margin: 0 auto 20px;
    border-radius: 16px;
  }
  .nabti-start-card {

  .nabti-start-card .nabti-title{font-size:28px;line-height:1.3;color:#4a3f4f;margin-top:0}
  .nabti-start-card .nabti-sub{font-size:14px;line-height:1.7;color:#8b7d90;margin-bottom:12px}
  .nabti-start-visual{position:relative;height:250px;max-width:330px;margin:0 auto 12px}
  .nabti-bubble{position:absolute;width:126px;height:126px;border-radius:30px;background:rgba(255,255,255,.82);box-shadow:0 12px 26px rgba(148,112,144,.12);display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.9)}

  .nabti-bubble.a{left:7%;top:12px;transform:rotate(-5deg)}.nabti-bubble.b{right:7%;top:7px;transform:rotate(5deg)}

  .nabti-start-card .nabti-btn{background:linear-gradient(135deg,#ee8eac,#b9a2dc);box-shadow:0 10px 22px rgba(189,137,174,.18)}

  @media(max-width:520px){#nabti-root{margin:10px auto}.nabti-start-card{border-radius:0;min-height:calc(100vh - 20px);padding-top:24px}.nabti-start-visual{height:235px}.nabti-bubble{width:116px;height:116px}}
  .nabti-nickname-input {
    display: block;
    width: 100%;
    padding: 13px 16px;
    margin-bottom: 14px;
    border: 2px solid #f2e6ee;
    border-radius: 14px;
    font-size: 15px;
    text-align: center;
    color: var(--text);
    background: #fffafd;
    font-family: inherit;
  }
  .nabti-nickname-input:focus {

  .nabti-qicon {

  }
  .nabti-blurb {
    font-size: 14.5px;
    line-height: 1.7;
    text-align: center;
    color: #6a5d6f;
    padding: 0 6px 18px;

  .nabti-sensitivity {

    border-radius: 16px;
    padding: 16px;
    margin-bottom: 18px;
  }
  .nabti-sensitivity-title {

    align-items: center;
    gap: 8px;

    font-weight: 700;
    margin-bottom: 10px;
  }

  .nabti-gauge-wrap {
    position: relative;
    width: 100%;
  }
  .nabti-gauge-wrap img.gauge-bg { width: 100%; display: block; }
  .nabti-gauge-fill {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    background: rgba(255,255,255,0.55);
    border-radius: 999px;
    right: 0;
    transition: right 0.6s ease;
  }
  .nabti-sensitivity-desc {
    font-size: 13px;
    color: #8a7d8f;
    margin-top: 8px;
    line-height: 1.6;
    text-align: center;
  }

  .nabti-btn-row {
    display: flex;
    gap: 10px;
  }
  .nabti-btn-outline {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 12px;
    border-radius: 999px;
    border: 2px solid #f2e6ee;
    background: #fff;
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
  }
  .nabti-btn-outline img { width: 18px; height: 18px; }

  .nabti-prev-link {
    display: block;
    text-align: center;
    margin-top: 4px;
    font-size: 13px;

  .nabti-compat {
    background: #fff7fa;
    border-radius: 16px;
    padding: 14px 16px;

    color: #6a5d6f;
  }
  .nabti-compat b { color: #d16a94; }

  .nabti-nickname-tag {
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin: 2px 0 16px;
    padding: 8px 0;

  .nabti-trait-row { margin-bottom: 12px; }
  .nabti-trait-label {

  .nabti-trait-bar {
    position: relative;
    width: 100%;
    height: 10px;
    border-radius: 999px;
    background: #f2e6ee;
    overflow: hidden;
  }
  .nabti-trait-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    background: linear-gradient(90deg, var(--pink), var(--lavender));
    border-radius: 999px;
  }

  .nabti-detail-section { margin-bottom: 16px; }
  .nabti-detail-title {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14.5px;
    font-weight: 800;

  .nabti-detail-list {

  .nabti-detail-text {

    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font-size: 13.5px;
  }
  .nabti-rank-row .rank-num {
    font-weight: 800;
    color: #d16a94;
    width: 28px;

  .nabti-btn-full {
    margin-bottom: 10px;
  }

  .nabti-toggle-btn {
    display: block;

    text-align: center;
    padding: 12px;
    margin-bottom: 18px;

    background: #fff7fa;
    color: #d16a94;
    font-size: 14px;
    font-weight: 700;

  .nabti-compat-sub-title {

  .nabti-detail-wrap {
    overflow: visible;

  .nabti-shared-tag {
    text-align: center;
    font-size: 13px;
    color: #b598c9;
    font-weight: 700;
    margin-bottom: 10px;

/* Result hierarchy: animal, three traits, optional detail. */
.nabti-result-frame{aspect-ratio:auto;max-width:210px;margin:0 auto 12px}.nabti-result-frame .character{position:relative!important;inset:auto!important;width:100%!important;height:auto!important;object-fit:contain!important;border-radius:24px}
.nabti-type-name{font-size:23px}.nabti-key-three{padding:14px 18px 14px 34px;text-align:left;background:#fff8ed;border-radius:18px;line-height:1.65;color:#514656;font-size:14px}.nabti-key-three li+li{margin-top:6px}
.nabti-response-note{font-size:12px;line-height:1.65;color:#756a7b}.nabti-response-hint{font-size:12px;color:#81758a;margin:6px 0 14px}.nabti-options{display:grid;gap:9px}.nabti-option{margin:0;min-height:48px;border-radius:14px;font-size:14px}.nabti-option[aria-pressed="true"]{border:2px solid #926fa4;background:#f1e7f7}.nabti-option:focus-visible{outline:3px solid #926fa4;outline-offset:2px}.nabti-progress-wrap{flex-wrap:wrap;gap:3px}.nabti-sensitivity{background:#faf6ff;border:none}.nabti-gauge-wrap{display:none}.nabti-nickname-tag{border:0}.nabti-compat{background:#fff;border:1px solid #f0e7ed;border-radius:16px;font-size:13px;line-height:1.65}.nabti-start-foot{line-height:1.6}

body{background:#fffaf4;color:#332d43} details>summary{min-height:44px;display:flex;align-items:center} button{font-family:inherit}
/* Detailed storybook illustrations with space for five response choices. */
.nabti-qicon{width:112px;height:102px;object-fit:contain;margin:2px auto 14px}
.nabti-loading img{width:190px;height:190px;object-fit:contain}
.nabti-paw{width:17px;height:17px;object-fit:contain;opacity:.28;filter:grayscale(1)}
.nabti-paw.filled{opacity:1;filter:none}.nabti-paw.current{opacity:1;filter:none;transform:scale(1.13);outline:1px solid #b79ad0;outline-offset:2px;border-radius:50%}
.nabti-detail-title .nabti-detail-art{width:38px;height:38px;object-fit:contain;vertical-align:middle;flex-shrink:0}

/* Phone-only entry screen: restore animal scale and use empty vertical space.
   All result screens and the original illustrations remain untouched. */
@media (max-width:520px) {
 #nabti-root{margin:0 auto}
 .nabti-start-card{
   min-height:100dvh;
   border-radius:0;
   padding:14px 18px;
   display:flex;
   flex-direction:column;
   justify-content:space-evenly;
 }
 .nabti-start-card .nabti-title{font-size:clamp(23px,6.3vw,28px);line-height:1.24;margin:0 0 5px}

 .nabti-season-badge{margin-bottom:7px}
 .nabti-start-visual{
   height:clamp(200px,34dvh,255px);
   max-width:310px;
   flex-shrink:0;
   margin:0 auto 6px;
 }
 .nabti-bubble{
   width:clamp(108px,17dvh,120px);
   height:clamp(108px,17dvh,120px);
 }
 .nabti-start-features{margin-bottom:9px}
 .nabti-start-card .nabti-nickname-input{padding:11px 14px;margin-bottom:9px}
 .nabti-start-card .nabti-btn{padding:12px 14px}

}
@media (max-width:520px) and (max-height:560px) {
 .nabti-start-visual{height:175px}

 .nabti-start-card{padding-top:10px;padding-bottom:10px}
}

<script>
(function() {
  const IMG = {
    bgPattern: "../../../../../illustrations/v1/loading.webp",
    coverImage: "../../../../../illustrations/v1/loading.webp",
    playButton: "../../../icons/play.svg",
    pawPrint: "../../../illustrations/v1/paw.webp",
    loadingChick: "../../../illustrations/v1/loading.webp",
    refreshIcon: "../../../icons/refresh.svg",
    shareIcon: "../../../icons/share.svg",
    badgeRibbon: "../../../../../illustrations/v1/loading.webp",
    gaugeBar: "../../../../../illustrations/v1/loading.webp",
    hedgehogGauge: "../../../illustrations/v1/radar.webp",
    snsFrame: "../../../../../illustrations/v1/loading.webp",
    iconEmotion: "../../../illustrations/v1/emotion.webp",
    iconRelationship: "../../../illustrations/v1/relationship.webp",
    iconAlonetime: "../../../illustrations/v1/alone.webp",
    iconPlanning: "../../../illustrations/v1/planning.webp",
    characters: {
      INTJ: "../../../characters/nabti-a/INTJ.webp", INTP: "../../../characters/nabti-a/INTP.webp",
      ENTJ: "../../../characters/nabti-a/ENTJ.webp", ENTP: "../../../characters/nabti-a/ENTP.webp",
      INFJ: "../../../characters/nabti-a/INFJ.webp", INFP: "../../../characters/nabti-a/INFP.webp",
      ENFJ: "../../../characters/nabti-a/ENFJ.webp", ENFP: "../../../characters/nabti-a/ENFP.webp",
      ISTJ: "../../../characters/nabti-a/ISTJ.webp", ISFJ: "../../../characters/nabti-a/ISFJ.webp",
      ESTJ: "../../../characters/nabti-a/ESTJ.webp", ESFJ: "../../../characters/nabti-a/ESFJ.webp",
      ISTP: "../../../characters/nabti-a/ISTP.webp", ISFP: "../../../characters/nabti-a/ISFP.webp",
      ESTP: "../../../characters/nabti-a/ESTP.webp", ESFP: "../../../characters/nabti-a/ESFP.webp"
    }
  };

  function characterUrl(type){return window.PlayzipCharacters.resolve(type,IMG.characters[type]);}
  function themeBadge(){const theme=window.PlayzipCharacters.current();return `<span class="nabti-season-badge" data-season-badge ${theme?'':'hidden'}>${theme?theme.label:''}</span>`;}
  function refreshCharacterArtwork(){
    const theme=window.PlayzipCharacters.current();root.dataset.theme=theme?theme.id:'';
    root.querySelectorAll('img[data-character]').forEach(img=>{
      const type=img.dataset.character,src=characterUrl(type);
      img.onerror=()=>{img.onerror=null;img.src=window.PlayzipCharacters.asset(IMG.characters[type]);};
      if(img.getAttribute('src')!==src)img.src=src;
    });
    root.querySelectorAll('[data-season-badge]').forEach(e=>{e.hidden=!theme;e.textContent=theme?theme.label:'';});
  }
  window.refreshPlayzipCharacterArtwork=refreshCharacterArtwork;
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshCharacterArtwork();});

  const COMPAT_AXES = [["E", "I"], ["S", "N"], ["T", "F"], ["J", "P"]];
  const COMPAT_AXIS_NAME = [["외향", "내향"], ["감각", "직관"], ["사고", "감정"], ["판단", "인식"]];
  const COMPAT_COMPLEMENT_GOOD = [true, false, false, true];

  function calcCompatRanking(scores) {
    const pref = COMPAT_AXES.map(([p, n]) => (scores[p] - scores[n]) / 3);
    const list = Object.keys(RESULTS).map(t => {
      let score = 0;
      for (let i = 0; i < 4; i++) {
        const target = (t[i] === COMPAT_AXES[i][0]) ? 1 : -1;
        const align = pref[i] * target;
        score += COMPAT_COMPLEMENT_GOOD[i] ? -align : align;
      }
      return { type: t, score };
    });
    list.sort((a, b) => b.score - a.score);
    return list;
  }

  function calcCompatDetail(scores, myType) {
    const ranked = calcCompatRanking(scores);
    const best = ranked[0];
    const bestPct = Math.round(60 + Math.max(0, Math.min(4, best.score)) / 4 * 39);

    const sameAxes = [];
    const diffAxes = [];
    for (let i = 0; i < 4; i++) {
      const mine = myType[i];
      const other = best.type[i];
      const label = other === COMPAT_AXES[i][0] ? COMPAT_AXIS_NAME[i][0] : COMPAT_AXIS_NAME[i][1];
      if (mine === other) sameAxes.push(label); else diffAxes.push(label);
    }
    let reason = "";
    if (sameAxes.length) reason += `${sameAxes.join("·")} 성향이 비슷해서 대화가 잘 통하고, `;
    if (diffAxes.length) reason += `${diffAxes.join("·")} 부분은 서로 달라서 부족한 점을 자연스럽게 채워줄 수 있어요.`;
    else reason += "성향이 두루 비슷해서 편안하게 어울릴 수 있어요.";

    return { ranked, best, bestPct, reason };
  }

      scores: { E: e, I: 3 - e, S: s, N: 3 - s, T: t, F: 3 - t, J: j, P: 3 - j },
      sensitivity: sen,
      nickname: nickname
    };
  }

  // 캐릭터 이미지가 webp라서 아이폰 카카오톡에서 미리보기 이미지가 안 뜨는 문제 방지용:
  // App sharing uses the native SDK; this public image is only a share preview.
  function toKakaoSafeImage(url) {
    const source=new URL(url,window.location.href).pathname;
    const animal=source.match(/\/characters\/nabti-a\/(themes\/halloween\/)?([A-Z]{4})\.webp$/);
    if(animal)return 'https://jeiskwon.github.io/playzip/share-art/nabti/'+(animal[1]?'halloween/':'base/')+animal[2]+'.png';
    if(/^\/playzip\/share-art\/tarot\/[a-f0-9]{16}\.jpg$/.test(source))return 'https://jeiskwon.github.io'+source;
    const media=source.match(/\/media\/([a-f0-9]{16})\.webp$/);
    if(media)return 'https://jeiskwon.github.io/playzip/share-art/tarot/'+media[1]+'.jpg';
    return 'https://jeiskwon.github.io/playzip/share-preview-v3.png';
  }

  function shareToKakao({ title, description, imageUrl, link }) {
    // 카드 본문과 하단 버튼을 모두 "친구 결과보기" 링크로 통일한다.
    // (버튼만 따로 시작화면으로 보내면, 사람들이 카드 대신 버튼을 눌러서
    //  결과 화면을 아예 못 보고 바로 새 테스트 화면으로 가버리는 문제가 있었음)
    const targetLink = link || shareLinkUrl;
    if (!window.Kakao || !Kakao.isInitialized()) {
      const fallbackText = `${title}\n${description}\n\n결과 보고 너도 테스트 해봐 👉 ${targetLink}`;
      navigator.clipboard?.writeText(fallbackText);
      alert("카카오 공유 기능을 불러오지 못했어요.\n대신 문구가 복사됐으니 카카오톡에 붙여넣어주세요.");
      return;
    }
    try {
      Kakao.Share.sendDefault({
        objectType: "feed",
        content: {
          title: title,
          description: description,
          imageUrl: toKakaoSafeImage(imageUrl),
          link: { mobileWebUrl: targetLink, webUrl: targetLink }
        },
        buttons: [
          {
            title: "결과 보러가기",
            link: { mobileWebUrl: targetLink, webUrl: targetLink }
          }
        ]
      });
    } catch (err) {
      const fallbackText = `${title}\n${description}\n\n결과 보고 너도 테스트 해봐 👉 ${targetLink}`;
      navigator.clipboard?.writeText(fallbackText);
      alert("카카오 공유창을 여는 데 실패했어요.\n대신 문구가 복사됐으니 카카오톡에 붙여넣어주세요.");
    }
  }

  function calcScores() {
    const scores = { E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0 };
    let sensitivity = 0;
    QUESTIONS.forEach((q, i) => {
      const idx = state.answers[i];
      if (idx === undefined) return;
      if (!Number.isInteger(idx) || idx < 0 || idx > 4) throw new Error("Invalid answer");
      if (q.sensitivity) {
        sensitivity += 1 + idx * 0.75;
      } else {
        scores[q.first] += idx / 4;
        scores[q.second] += (4 - idx) / 4;
      }
    });
    return { scores, sensitivity };
  }

  function calcType(scores) {
    const s = scores;
    const type =
      (s.E >= s.I ? "E" : "I") +
      (s.S >= s.N ? "S" : "N") +
      (s.T >= s.F ? "T" : "F") +
      (s.J >= s.P ? "J" : "P");
    return type;
  }

  function calcAxisPercents(scores) {
    return [
      { leftLetter: "E", leftLabel: "외향", leftPct: Math.round(scores.E / 3 * 100), rightLetter: "I", rightLabel: "내향", rightPct: Math.round(scores.I / 3 * 100) },
      { leftLetter: "S", leftLabel: "감각", leftPct: Math.round(scores.S / 3 * 100), rightLetter: "N", rightLabel: "직관", rightPct: Math.round(scores.N / 3 * 100) },
      { leftLetter: "T", leftLabel: "사고", leftPct: Math.round(scores.T / 3 * 100), rightLetter: "F", rightLabel: "감정", rightPct: Math.round(scores.F / 3 * 100) },
      { leftLetter: "J", leftLabel: "판단", leftPct: Math.round(scores.J / 3 * 100), rightLetter: "P", rightLabel: "인식", rightPct: Math.round(scores.P / 3 * 100) }
    ];
  }

  function calcClosestTypes(scores) {
    const axes = [["E", "I"], ["S", "N"], ["T", "F"], ["J", "P"]];
    const pref = axes.map(([p, n]) => (scores[p] - scores[n]) / 3);
    const all = Object.keys(RESULTS).map(t => {
      let d = 0;
      for (let i = 0; i < 4; i++) {
        const target = (t[i] === axes[i][0]) ? 1 : -1;
        d += Math.abs(pref[i] - target);
      }
      return { type: t, distance: d };
    });
    all.sort((a, b) => a.distance - b.distance);
    return all;
  }

    const shareBtn = document.getElementById("nabti-share-btn");
    const sendCurrentResult = () => {
        const resultUrl = buildResultUrl(scores, sensitivity, state.nickname);
        shareToKakao({
          title: `${state.nickname}님은 ${result.animal}상이시네요! (${type})`,
          description: `${result.blurb} 이번 답변에 가까운 동물 후보를 함께 살펴보세요.`,
          imageUrl: characterUrl(type),
          link: resultUrl
        });
    };
    window.playzipShareCurrentResult = sendCurrentResult;
    if (shareBtn) shareBtn.onclick = sendCurrentResult;
  }

  const sharedResult = parseSharedResult();
  if (sharedResult) {
    state.nickname = sharedResult.nickname;
    renderResult(sharedResult);
  } else {
    const p=readProgress(),st=p&&p.state;
    const valid=st&&Number.isInteger(st.step)&&st.step>=0&&st.step<=QUESTIONS.length&&Array.isArray(st.answers)&&st.answers.length<=QUESTIONS.length&&st.answers.every(x=>Number.isInteger(x)&&x>=0&&x<RESPONSE_LABELS.length)&&st.answers.slice(0,st.step).length===st.step;
    if(valid && ["question","loading","result"].includes(p.stage)){
      state=st;
      if(st.step===QUESTIONS.length)renderResult();else renderQuestion();
    }else renderStart();
  }
  window.playzipGoBack=()=>{
    if(screen==="shared"){location.replace(location.pathname);return true;}
    if(screen==="question" && state.step>0){state.step--;renderQuestion();return true;}
    if(screen==="loading"){state.step=QUESTIONS.length-1;renderQuestion();return true;}
    if(screen!=="start"){resetState();renderStart();return true;}
    return false;
  };
  refreshCharacterArtwork();
})();
</script>
