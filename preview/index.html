<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffaf4">
<meta name="description" content="운명코드 — 나를 읽는 세 가지 코드. 사주 · 타로 · 나BTI">
<title>운명코드 | 나를 읽는 세 가지 코드</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/webp" href="./icon.webp">
<style>
:root{--bg:#fffaf4;--text:#332d43;--muted:#82788c;--purple:#7954be;--pink:#ed75a8;--line:#e6dff0}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#f4eff7;color:var(--text);font-family:"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,a{font:inherit}button{cursor:pointer}a{color:inherit}button:focus-visible,a:focus-visible{outline:3px solid #986ee0;outline-offset:3px}
.app{max-width:520px;height:100dvh;min-height:420px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);box-shadow:0 0 35px #35294320}
.top{height:58px;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative;background:var(--bg);border-bottom:1px solid #f2eaf5}
.top h1{font-size:21px;font-weight:900;margin:0;letter-spacing:-.04em}.top .back{position:absolute;left:12px;top:7px;border:0;background:transparent;color:var(--text);font-size:29px;width:44px;height:44px;border-radius:13px}.top .action{position:absolute;right:12px;top:7px;border:0;background:transparent;color:var(--purple);font-weight:850;font-size:15px;height:44px;padding:0 10px}
#area{flex:1;min-height:0;position:relative;background:var(--bg);overflow:auto}
#homePane,#historyPane,#infoPane{width:100%;min-height:100%;padding:20px 17px 25px}
#homePane h2{margin:3px 0 5px;font-size:24px;letter-spacing:-.05em}#homePane .sub{margin:0 0 20px;font-size:13px;color:var(--muted)}
.service{width:100%;min-height:148px;margin:0 0 12px;padding:12px 13px 12px 17px;display:flex;align-items:center;justify-content:space-between;gap:5px;border:1px solid #e8e0eb;background:#fff;border-radius:22px;text-align:left;color:var(--text);box-shadow:0 7px 22px #4434510a}
.service.saju{background:linear-gradient(120deg,#fff9f8,#f5f0ff)}.service.tarot{background:linear-gradient(125deg,#fff9fb,#f3efff)}.service.nabti{background:linear-gradient(120deg,#fbfaff,#f4f5fc)}
.service .copy{flex:1;min-width:0;align-self:center}.service strong{display:block;font-size:21px;letter-spacing:-.04em}.service small{display:block;margin-top:7px;font-size:12px;color:var(--muted)}.service .enter{display:block;margin-top:12px;font-size:12px;color:var(--purple);font-weight:850}
.service .art{width:145px;height:115px;position:relative;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
.service .art>img{max-width:100%;height:100%;object-fit:contain}.people img{position:absolute;object-fit:contain;object-position:center bottom;bottom:0;width:53px;height:100px}
.people img:nth-child(1){left:1px;height:94px}.people img:nth-child(2){left:40px;height:108px;z-index:2}.people img:nth-child(3){right:0;height:105px}
.animals img{width:62px;height:62px;position:absolute;object-fit:contain}.animals img:nth-child(1){left:8px;top:0}.animals img:nth-child(2){right:7px;top:0}.animals img:nth-child(3){left:8px;bottom:0}.animals img:nth-child(4){right:7px;bottom:0}
.recent{padding:16px;border-radius:20px;background:white;border:1px solid #efe7f2;margin-top:19px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.section-head h3{margin:0;font-size:17px}.link-btn{border:0;background:transparent;color:var(--purple);font-size:12px;font-weight:850}
.empty{background:#fbf8fd;border-radius:14px;padding:17px 11px;text-align:center;margin-top:12px}.empty strong{font-size:14px;color:var(--purple)}.empty p{font-size:12px;line-height:1.6;color:var(--muted);margin:5px 0 0}
.recent-entry{border:0;background:#faf7fe;display:block;text-align:left;padding:12px;border-radius:13px;width:100%;margin-top:9px}.recent-entry strong{font-size:13px;display:block}.recent-entry small{display:block;color:var(--muted);font-size:11px;margin-top:4px;line-height:1.4}
.home-foot{margin:19px 0 0;text-align:center;color:#8d8591;font-size:11px}.home-foot button{border:0;background:none;color:var(--purple);font-weight:750;padding:8px}
#moduleFrame{display:none;width:100%;height:100%;border:0;background:var(--bg)}
nav{flex-shrink:0;height:68px;padding-bottom:env(safe-area-inset-bottom,0px);height:calc(68px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #f0eaf3}
nav button{border:0;background:transparent;color:#928a9c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11px;padding:6px 0;font-weight:750}
nav button[aria-current="page"]{color:var(--purple)}nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hidden{display:none!important}#historyPane h2,#infoPane h2{font-size:23px;letter-spacing:-.04em;margin:2px 0 18px}
.hist-entry{padding:16px;background:#fff;border:1px solid #ece5ef;border-radius:17px;margin-bottom:12px}
.hist-entry .kind{font-size:11px;font-weight:850;color:var(--purple)}.hist-entry h3{font-size:16px;margin:6px 0}.hist-entry p{color:var(--muted);font-size:13px;line-height:1.65;word-break:keep-all}.hist-entry button{border:0;background:#eee5fc;color:#60459b;border-radius:10px;padding:10px 15px;font-weight:800;font-size:12px}
#clearHistory{background:#f5eaf0;color:#aa547a;border:0;border-radius:12px;padding:9px;font-size:12px}
#infoPane p{font-size:13px;color:var(--muted);line-height:1.8}#infoPane a{color:var(--purple);font-weight:850}
#note{position:absolute;left:50%;bottom:82px;transform:translateX(-50%);background:#332d43;color:white;border-radius:25px;padding:10px 16px;z-index:4;font-size:12px;box-shadow:0 4px 22px #0003;max-width:90%;display:none;text-align:center}
@media(max-width:370px){.service .art{width:115px}.people img{width:46px}.people img:nth-child(2){left:32px}.service strong{font-size:19px}}
@media(min-width:700px){.app{margin:16px auto;height:min(880px,calc(100dvh - 32px));border-radius:25px;overflow:hidden}}
@media(prefers-reduced-motion:no-preference){.service{transition:transform .16s}.service:active{transform:scale(.985)}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <button class="back hidden" id="goBack" aria-label="뒤로가기">‹</button>
    <h1 id="toolbarTitle">운명코드</h1>
    <button class="action hidden" id="toolbarAction">홈</button>
  </header>
  <main id="area">
    <section id="homePane">
      <h2>나를 읽는 세 가지 코드</h2>
      <p class="sub">사주 · 타로 · 나BTI를 한곳에서</p>
      <button class="service saju" data-section="saju"><span class="copy"><strong>사주 · 운세</strong><small>루미 · 노바 · 정연</small><span class="enter">시작하기 →</span></span><span class="art people">
        <img src="assets/characters/home/lumi.webp" alt="루미">
        <img src="assets/characters/home/nova.webp" alt="노바">
        <img src="assets/characters/home/jeong.webp" alt="정연">
      </span></button>
      <button class="service tarot" data-section="tarot"><span class="copy"><strong>타로</strong><small>궁금한 일, 마음에 떠오르는 카드</small><span class="enter">시작하기 →</span></span><span class="art"><img src="../illustrations/v1/home-transparent.webp" alt="달빛 타로 테이블"></span></button>
      <button class="service nabti" data-section="nabti"><span class="copy"><strong>나BTI</strong><small>동물 캐릭터로 알아보는 나의 성향</small><span class="enter">시작하기 →</span></span><span class="art animals">
        <img src="../characters/nabti-a/INTJ.webp" alt="부엉이">
        <img src="../characters/nabti-a/ENFP.webp" alt="다람쥐">
        <img src="../characters/nabti-a/ISFJ.webp" alt="코알라">
        <img src="../characters/nabti-a/ESTP.webp" alt="치타">
      </span></button>
      <section class="recent"><div class="section-head"><h3>최근 결과</h3><button class="link-btn" data-section="history">최근 5개 보기 →</button></div><div id="homeRecent"></div></section>
      <div class="home-foot"><button data-section="privacy">개인정보처리방침 · 오픈소스 안내</button></div>
    </section>
    <section id="historyPane" class="hidden"><div class="section-head"><h2>내 결과함</h2><button id="clearHistory">전체삭제</button></div><div id="historyResults"></div></section>
    <section id="infoPane" class="hidden"><h2>이용 및 개인정보 안내</h2><p>운명코드는 사주·타로·나BTI 결과를 오락 및 자기이해를 위한 참고 콘텐츠로 제공합니다.</p><p>웹에서 입력한 정보와 최근 결과는 사용 중인 브라우저의 로컬 저장소에 저장됩니다. 앱에 저장된 정보와 자동 동기화되지 않습니다. 브라우저의 사이트 데이터 삭제 시 저장 정보도 사라질 수 있습니다.</p><p><a href="assets/privacy_0_99.html" target="_blank" rel="noopener noreferrer">개인정보처리방침</a> · <a href="assets/third_party_notices.html" target="_blank" rel="noopener noreferrer">오픈소스 안내</a></p></section>
    <iframe id="moduleFrame" title="운명코드 콘텐츠" loading="eager" allow="clipboard-write"></iframe>
    <div id="note" role="status"></div>
  </main>
  <nav aria-label="운명코드 메뉴">
    <button data-section="home" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 10 12 3l9 7v11H3Z"/><path d="M9 21v-8h6v8"/></svg>홈</button>
    <button data-section="saju"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg>사주</button>
    <button data-section="tarot"><svg viewBox="0 0 24 24"><rect x="5" y="2.5" width="14" height="19" rx="2"/><path d="m12 7 1.2 2.8L16 11l-2.8 1.1L12 15l-1.2-2.9L8 11l2.8-1.2Z"/></svg>타로</button>
    <button data-section="nabti"><svg viewBox="0 0 24 24"><path d="M12 20c4 0 7-3 7-6s-2-5-3-5-2 2-4 2-3-2-4-2-3 2-3 5 3 6 7 6Z"/><path d="M7 5h.01M12 3h.01M17 5h.01"/></svg>나BTI</button>
    <button data-section="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2M3 5v4h4"/></svg>기록</button>
  </nav>
</div>
<script>
(function(){
 'use strict';
 const paths={saju:'assets/saju_v2.html',tarot:'assets/tech-asset/index.html',nabti:'assets/nabti/index.html'};
 const names={home:'운명코드',saju:'사주',tarot:'타로',nabti:'나BTI',history:'내 결과함',privacy:'개인정보처리방침'};
 const $=id=>document.getElementById(id);
 const frame=$('moduleFrame'),sections=['homePane','historyPane','infoPane'],historyKey='unmyeongcode.web.history.v1';
 let section='home',noteTimer;
 const escape=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function records(){try{let x=JSON.parse(localStorage.getItem(historyKey)||'[]');return Array.isArray(x)?x.slice(0,5):[]}catch(e){return []}}
 function saveResult(kind,title,detail,url){
  if(!kind||!title)return;
  const list=records();
  const record={kind:String(kind).slice(0,20),title:String(title).slice(0,140),detail:String(detail||'').slice(0,500),url:String(url||'').slice(0,1800),timestamp:Date.now()};
  if(list[0]&&list[0].kind===record.kind&&list[0].title===record.title&&list[0].detail===record.detail)return;
  localStorage.setItem(historyKey,JSON.stringify([record,...list.filter(x=>x.kind!==record.kind||x.title!==record.title)].slice(0,5)));
  renderHistory();
 }
 function prettyTime(t){try{return new Date(t).toLocaleString('ko-KR',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch(_){return ''}}
 function renderHistory(){
  const items=records(),home=$('homeRecent'),list=$('historyResults');
  home.replaceChildren();list.replaceChildren();
  if(!items.length){home.innerHTML='<div class="empty"><strong>아직 결과가 없어요</strong><p>사주 · 타로 · 나BTI 중 하나를 시작하면 최근 결과가 여기에 보여요.</p></div>';list.innerHTML='<div class="empty"><strong>아직 저장된 결과가 없습니다.</strong><p>결과를 보면 자동으로 기록됩니다.</p></div>';return}
  const latest=items[0],small=document.createElement('button');small.className='recent-entry';small.innerHTML='<strong>'+escape(latest.title)+'</strong><small>'+escape(latest.kind)+' · '+escape(latest.detail).slice(0,110)+'</small>';small.onclick=()=>openSaved(latest);home.append(small);
  for(const item of items){
   const card=document.createElement('article');card.className='hist-entry';
   card.innerHTML='<span class="kind">'+escape(item.kind)+' · '+escape(prettyTime(item.timestamp))+'</span><h3>'+escape(item.title)+'</h3><p>'+escape(item.detail)+'</p>';
   const b=document.createElement('button');b.textContent='결과 다시 보기';b.onclick=()=>openSaved(item);card.append(b);list.append(card);
  }
 }
 function toast(message){const n=$('note');n.textContent=message;n.style.display='block';clearTimeout(noteTimer);noteTimer=setTimeout(()=>n.style.display='none',2700)}
 function openSaved(item){
  const target=item.kind.includes('사주')?'saju':item.kind.includes('타로')?'tarot':item.kind.includes('나BTI')?'nabti':'home';
  const path=paths[target],raw=String(item.url||'');
  let safe=path;
  if(path){
   try{const u=new URL(raw,location.href);const expected=new URL(path,location.href);
    if(u.origin===location.origin&&u.pathname===expected.pathname)safe=path+u.search+u.hash;
    else if(target==='saju'&&u.hash.startsWith('#s='))safe=path+u.hash;
   }catch(e){}
  }
  navigate(target,{src:safe});
 }
 function navigate(next,opts={}){
  if(!Object.hasOwn(names,next))next='home';
  const same=section===next;section=next;
  if(!opts.noHistory)history.pushState({view:next},'', '#'+next);
  sections.forEach(id=>$(id).classList.toggle('hidden',Boolean(paths[next])||id!==(next==='home'?'homePane':next==='history'?'historyPane':'infoPane')));
  frame.style.display=paths[next]?'block':'none';
  $('toolbarTitle').textContent=names[next];$('goBack').classList.toggle('hidden',next==='home');
  $('toolbarAction').classList.toggle('hidden',next==='home');$('toolbarAction').textContent=next==='history'?'홈':'홈';
  document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-current',x.dataset.section===next?'page':'false'));
  if(paths[next]){
   const src=opts.src||paths[next]+(next==='saju'?'':'?playzip_new=1');
   frame.src=src;
  }else {if(frame.src)frame.removeAttribute('src');$('area').scrollTop=0;if(next==='history'||next==='home')renderHistory()}
 }
 function back(){
  if(paths[section]){
    try{if(frame.contentWindow&&typeof frame.contentWindow.playzipGoBack==='function'&&frame.contentWindow.playzipGoBack()===true)return}catch(e){}
  }
  navigate('home');
 }
 function topShare(){if(paths[section]){try{const w=frame.contentWindow;if(typeof w.playzipShareCurrentResult==='function'){w.playzipShareCurrentResult();return}}catch(e){} }toast('결과 화면의 공유하기 버튼을 이용해주세요.')}
 document.querySelectorAll('[data-section]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.section)));
 $('goBack').addEventListener('click',back);$('toolbarAction').addEventListener('click',()=>navigate('home'));
 $('clearHistory').addEventListener('click',()=>{if(!records().length)return;if(confirm('저장된 최근 결과 5개를 모두 삭제할까요?')){localStorage.removeItem(historyKey);renderHistory()}});
 window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow||!e.data||e.data.source!=='unmyeongcode-web')return;const m=e.data;if(m.type==='saveResult')saveResult(m.kind,m.title,m.detail,m.url);if(m.type==='openHome')navigate('home');});
 window.addEventListener('popstate',()=>navigate((location.hash||'#home').slice(1).split('?')[0],{noHistory:true}));
 window.unmyeongWeb={navigate,saveResult,toast};
 renderHistory();
 const first=(location.hash||'#home').slice(1).split('?')[0];navigate(names[first]?first:'home',{noHistory:true});
})();
</script>
</body></html>
