<style>
:root{--ink:#292348;--muted:#746d91;--purple:#6d58d9;--pink:#ed69ae}
*{box-sizing:border-box}
html{background:#f4f0ff}
body{margin:0;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 50% 0,#fff 0,#f5f0ff 48%,#eee9fb 100%)}

.link:focus-visible{outline:4px solid var(--purple);outline-offset:3px}
.link span{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;color:white;background:linear-gradient(135deg,var(--purple),var(--pink))}
.note{text-align:center;margin:24px 20px 0;color:var(--muted);font-size:13px;line-height:1.7}
footer{text-align:center;margin-top:28px;color:#aaa1bd;font-size:12px}
@media(max-width:680px){.links{grid-template-columns:1fr;margin-top:16px}.link{min-height:64px;font-size:17px}main{padding-bottom:30px}}
@media(prefers-reduced-motion:reduce){.link{transition:none}}
